[package]
name = "backend-template"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[dependencies]
application = { workspace = true }
infrastructure = { workspace = true }
rest = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

sea-orm = { workspace = true, features = [
    "sqlx-postgres",
    "runtime-tokio",
] }

config = { workspace = true, features = ["toml"] }

# 序列化
serde = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "time"] }
tracing-appender = { workspace = true }

# 时间
time = { workspace = true, features = ["formatting"] }

inventory = { workspace = true }

[workspace.dependencies]
application = { path = "crates/application" }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
rest = { path = "crates/rest" }

axum = { version = "0.8.9", default-features = false }
tokio = { version = "1.52.4" }
tower-http = { version = "0.7.0" }

# PostgreSQL runtime model support used by the infrastructure crate.
sea-orm = { version = "2.0.0", default-features = false }
sea-orm-migration = { version = "2.0.0", default-features = false }
config = { version = "0.15.25", default-features = false }
thiserror = "2.0.18"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
tracing-appender = "0.2.5"

# swagger doc
utoipa = "5.5.0"
utoipa-axum = "0.2.0"

utoipa-swagger-ui = { version = "9.0.2" }
inventory = "0.3"
time = "0.3.53"
async-trait = "0.1.89"
